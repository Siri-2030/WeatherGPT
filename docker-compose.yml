# ==============================================================================
# WeatherGPT - docker-compose  (backend + frontend together)
#   1. cp .env.example .env      (add GROQ_API_KEY and/or GOOGLE_API_KEY)
#   2. docker compose up --build
#   3. Open http://localhost:8501   (API docs: http://localhost:8000/docs)
# ==============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathergpt-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
      - weathergpt-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: weathergpt-frontend
    ports:
      - "8501:8501"
    environment:
      # Inside the compose network the backend is reachable by service name.
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weathergpt-net

  # Optional: fully offline local LLM. Uncomment, then set
  # LLM_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434 in .env
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: weathergpt-ollama
  #   ports: ["11434:11434"]
  #   volumes: [ollama_data:/root/.ollama]
  #   networks: [weathergpt-net]

networks:
  weathergpt-net:
    driver: bridge

